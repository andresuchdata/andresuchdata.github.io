<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Miss Glam Commercial Workspaces · Green Architecture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%239C2548'/><text x='50' y='68' font-family='sans-serif' font-size='52' font-weight='800' fill='white' text-anchor='middle'>MG</text></svg>">
</head>
<body>
  <div id="app-container">
    <!-- Sidebar Navigation -->
    <aside id="sidebar"></aside>

    <!-- Main Workspace -->
    <div id="main-workspace">
      <!-- Top Navigation & Role Bar -->
      <header id="topbar"></header>

      <!-- Dynamic Content View Area -->
      <main id="content-view" tabindex="-1"></main>
    </div>
  </div>

  <!-- Accessible Dialog Modal -->
  <dialog id="dialog"></dialog>

  <!-- Toast Notification Container -->
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
